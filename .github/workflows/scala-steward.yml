name: scala-steward
on:
  push:
    branches: [ master ]
  schedule:
  - cron: '0 21 * * *'
jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'unfiltered' }}
    steps:
    - name: Generate token
      id: generate_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: 89698
        private-key: ${{ secrets.UNFILTERED_APP_KEY }}
    - name: Launch Scala Steward
      uses: scala-steward-org/scala-steward-action@3e5cae868160200afda12b57c150e56cede989ab # v2.97.0
      with:
        github-token: ${{ steps.generate_token.outputs.token }}
        author-email: "74865306+unfiltered-app[bot]@users.noreply.github.com"
        author-name: "unfiltered-app[bot]"
